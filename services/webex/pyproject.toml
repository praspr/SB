[project]
name = "sb-webex"
version = "0.1.0"
description = "Read-only Webex client for the local sb dashboard"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "keyring>=25.0",
    "truststore>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_webex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
