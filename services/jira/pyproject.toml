[project]
name = "sb-jira"
version = "0.1.0"
description = "Read-only JIRA ticket service for the sb web app"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "keyring>=25.0",
    "fastmcp>=4.0.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_jira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
