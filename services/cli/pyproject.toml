[project]
name = "sb-cli"
version = "0.1.0"
description = "Command-line client for the sb narrative ledger"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
sb = "sb_cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
