[project]
name = "sb-core"
version = "0.1.0"
description = "Unified local MCP service for sb"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=4.0,<5",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "sb-jira",
    "sb-todos",
    "sb-webex",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
sb-jira = { path = "../jira", editable = true }
sb-todos = { path = "../todos", editable = true }
sb-webex = { path = "../webex", editable = true }
